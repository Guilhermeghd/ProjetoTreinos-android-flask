name: CI

# Dispara em todo push e pull request para a branch main.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # -------- 1) Testes --------
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api_flask_treinosjc_android

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api_flask_treinosjc_android/requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Executar testes
        run: pytest -v

  # -------- 2) Build --------
  build:
    needs: test            # só roda se os testes passarem
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir a imagem Docker da API
        uses: docker/build-push-action@v6
        with:
          context: ./api_flask_treinosjc_android
          push: false
          tags: treinosjc-api:${{ github.sha }}
