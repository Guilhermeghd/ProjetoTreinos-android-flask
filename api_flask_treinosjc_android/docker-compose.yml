services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: academia_db
    ports:
      - "3307:3306"
      - "5000:5000"   # agora declarada aqui, pois a api não tem mais rede própria
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql

  api:
    build: .
    restart: unless-stopped
    network_mode: "service:db"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/academia_db

volumes:
  db_data: